name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/investment-app
            # `npm install` on the server rewrites client/package-lock.json, so a
            # plain `git pull` aborts on the local change. The repo is the source
            # of truth for tracked files; db.json and .env are untracked/ignored
            # and survive the reset.
            git fetch origin main
            git reset --hard origin/main
            npm install --omit=dev
            npm --prefix client install
            npm run build
            pm2 restart investment-app
